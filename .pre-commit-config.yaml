---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^testdata/.*/want/
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: goimports
        name: goimports
        language: golang
        entry: goimports -w
        types: [go]
        additional_dependencies: [golang.org/x/tools/cmd/goimports@v0.50.0]

      # golangci-lint is installed separately to match the CI version exactly.
      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint run --fix --timeout=5m
        types: [go]
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.sh$

  # testdata holds anonymized dumps of real clusters.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        files: \.(yaml|yml)$
        exclude: ^krew/.*\.tmpl$
